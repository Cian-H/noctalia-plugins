id = "cian-h/workday-progress"
name = "Workday Progress"
version = "1.0.0"
plugin_api = 14
author = "Cian Hughes"
license = "MIT"
tags = ["bar", "panel", "utility", "time"]
icon = "briefcase"
description = "Tracks and displays progress through the work day."

[[setting]]
key = "start_hour"
type = "int"
label_key = "settings.start_hour.label"
description_key = "settings.start_hour.description"
default = 9
min = 0
max = 23

[[setting]]
key = "start_minute"
type = "int"
label_key = "settings.start_minute.label"
description_key = "settings.start_minute.description"
default = 0
min = 0
max = 59

[[setting]]
key = "end_hour"
type = "int"
label_key = "settings.end_hour.label"
description_key = "settings.end_hour.description"
default = 17
min = 0
max = 23

[[setting]]
key = "end_minute"
type = "int"
label_key = "settings.end_minute.label"
description_key = "settings.end_minute.description"
default = 0
min = 0
max = 59

[[setting]]
key = "work_days"
type = "select"
label_key = "settings.work_days.label"
description_key = "settings.work_days.description"
default = "weekdays"
options = [
  { value = "weekdays", label_key = "settings.work_days.options.weekdays" },
  { value = "all", label_key = "settings.work_days.options.all" },
]

[[setting]]
key = "direction"
type = "select"
label_key = "settings.direction.label"
description_key = "settings.direction.description"
default = "elapsed"
options = [
  { value = "elapsed", label_key = "settings.direction.options.elapsed" },
  { value = "remaining", label_key = "settings.direction.options.remaining" },
]

[[setting]]
key = "color_mode"
type = "select"
label_key = "settings.color_mode.label"
description_key = "settings.color_mode.description"
default = "dynamic"
options = [
  { value = "dynamic", label_key = "settings.color_mode.options.dynamic" },
  { value = "accent", label_key = "settings.color_mode.options.accent" },
]

[[setting]]
key = "track_padding"
type = "int"
label_key = "settings.track_padding.label"
description_key = "settings.track_padding.description"
default = 4
min = 0
max = 16

[[widget]]
id = "progress"
entry = "widget.luau"

[widget.actions]
left = "panel-toggle cian-h/workday-progress:summary"

[[panel]]
id = "summary"
entry = "panel.luau"
width = 380
height = 290
placement = "floating"
position = "center"
open_near_click = true
